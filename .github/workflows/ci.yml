name: CI

# Continuous integration for this fork.
#
# Upstream's workflow also published coverage to its Coveralls project and
# deployed documentation to docs.baby-buddy.net. Neither applies here: the
# Coveralls project belongs to upstream, and the docs deploy used third-party
# actions pinned to a moving branch, which would run with a write-scoped token
# on every push. Both were removed rather than left to fail.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the Dockerfile; the later version catches deprecations
        # early.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm install --location=global gulp-cli
      - run: npm ci
      - name: Lint
        run: gulp lint
      - name: Build front-end assets
        run: gulp build
      - name: Test
        run: gulp test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Build only. Nothing is published, so no registry credentials are needed.
      - name: Build the image
        run: docker build --tag babybuddy:ci .
      - name: Check the image starts and serves a page
        run: |
          docker run --detach --name babybuddy-ci \
            --env SECRET_KEY="ci-only-not-a-real-key-$RANDOM$RANDOM" \
            --env ALLOWED_HOSTS=127.0.0.1 \
            --env BABYBUDDY_ADMIN_PASSWORD=ci-only-password \
            --publish 8000:8000 \
            babybuddy:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "Host: 127.0.0.1" http://127.0.0.1:8000/login/; then
              echo "Login page served after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not serve the login page in time." >&2
          docker logs babybuddy-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs babybuddy-ci || true
