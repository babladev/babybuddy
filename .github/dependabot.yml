version: 2

# Dependabot opens pull requests for outdated and vulnerable dependencies.
# Grouping keeps the volume manageable on a personal fork: one PR per ecosystem
# per week rather than one per package.

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  # Actions are a supply-chain risk in their own right: a compromised action
  # runs inside the workflow with access to its token.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
